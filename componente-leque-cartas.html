<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Componente Leque de Cartas - Copa 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Fundo Estético da Página (Simulador) */
body { margin: 0; background-color: #050D1F; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; color: #fff; }
.instruction-text { text-align: center; margin-top: 40px; font-size: 15px; color: rgba(255,255,255,0.6); max-width: 400px; line-height: 1.6; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   COMPONENTE: LEQUE DE CARTAS (STANDALONE)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.sfc-wrapper { background: transparent; padding: 60px 40px; display: flex; justify-content: center; align-items: center; }
.sfc-container { width: 520px; height: 380px; position: relative; perspective: 1200px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; animation: floatFan 3.5s ease-in-out infinite; }
@keyframes floatFan { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }

/* Base da Carta */
.sfc-card {
    width: 200px; height: 280px; position: absolute; bottom: 20px; left: calc(50% - 100px); border-radius: 12px;
    transform-origin: bottom center; will-change: transform, box-shadow, z-index; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transform: translate(var(--stack-x), var(--stack-y)) rotate(var(--stack-r));
    transition: transform 400ms ease-in-out, box-shadow 400ms ease-in-out, z-index 400ms;
}

/* ESTADO FECHADO (Stack) */
.sfc-card:nth-child(1) { z-index: 1; --stack-x: 5px; --stack-y: 15px; --stack-r: -18deg; }
.sfc-card:nth-child(2) { z-index: 2; --stack-x: 4px; --stack-y: 12px; --stack-r: 15deg;  }
.sfc-card:nth-child(3) { z-index: 3; --stack-x: 3px; --stack-y: 9px;  --stack-r: -11deg; }
.sfc-card:nth-child(4) { z-index: 4; --stack-x: 2px; --stack-y: 6px;  --stack-r: 7deg;   }
.sfc-card:nth-child(5) { z-index: 5; --stack-x: 1px; --stack-y: 3px;  --stack-r: -4deg;  }
.sfc-card:nth-child(6) { z-index: 6; --stack-x: 0px; --stack-y: 0px;  --stack-r: 0deg;   }

/* ESTADO ABERTO (Leque) quando .is-open */
.sfc-container.is-open .sfc-card { transform: rotate(var(--fan-r)) translate(var(--fan-x), var(--fan-y)); transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 500ms ease, z-index 0ms; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.3); }

/* Staggers e Posições do Leque no Desktop */
.sfc-container.is-open .sfc-card:nth-child(1) { --fan-x: -160px; --fan-y: -20px; --fan-r: -30deg; transition-delay: 0ms; }
.sfc-container.is-open .sfc-card:nth-child(2) { --fan-x: -90px;  --fan-y: -40px; --fan-r: -18deg; transition-delay: 40ms; }
.sfc-container.is-open .sfc-card:nth-child(3) { --fan-x: -25px;  --fan-y: -50px; --fan-r: -6deg;  transition-delay: 80ms; }
.sfc-container.is-open .sfc-card:nth-child(4) { --fan-x: 25px;   --fan-y: -50px; --fan-r: 6deg;   transition-delay: 120ms; }
.sfc-container.is-open .sfc-card:nth-child(5) { --fan-x: 90px;   --fan-y: -40px; --fan-r: 18deg;  transition-delay: 160ms; }
.sfc-container.is-open .sfc-card:nth-child(6) { --fan-x: 160px;  --fan-y: -20px; --fan-r: 30deg;  transition-delay: 200ms; }

/* HOVER ESPECÍFICO DE CADA CARTA */
.sfc-container.is-open .sfc-card:hover { transform: rotate(var(--fan-r)) translate(var(--fan-x), calc(var(--fan-y) - 20px)); z-index: 100 !important; transition-delay: 0ms; transition-duration: 300ms; }

/* DESIGN INTERNO DA CARTA */
.sfc-fallback { position: absolute; inset: 0; border-radius: 12px; background: #003087; background-image: linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.05) 75%, rgba(255,255,255,0.05)), linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.05) 75%, rgba(255,255,255,0.05)); background-size: 20px 20px; background-position: 0 0, 10px 10px; display: flex; justify-content: center; align-items: center; z-index: 1; overflow: hidden; }
.sfc-fallback span { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; color: rgba(255,255,255,0.8); transform: rotate(-15deg); letter-spacing: 2px; }
.sfc-img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; z-index: 2; }
.sfc-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 55%); border-radius: 12px; z-index: 3; pointer-events: none; }
.sfc-card::before { content: ""; position: absolute; inset: 0; border: 3px solid rgba(255,255,255,0.25); border-radius: 12px; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.15); z-index: 6; pointer-events: none; }

/* Tipografia / UI */
.sfc-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 10px; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 12px; color: #fff; z-index: 4; }
.sfc-name { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; color: #fff; z-index: 4; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }

/* Brilho ao Passar o Mouse */
.sfc-shine { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; z-index: 5; pointer-events: none; }
.sfc-shine::after { content: ""; position: absolute; top: 0; left: -100%; right: 0; bottom: 0; width: 200%; background: linear-gradient(135deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 60%); transform: translateX(-100%); transition: transform 400ms ease; }
.sfc-container.is-open .sfc-card:hover .sfc-shine::after { transform: translateX(100%); }

/* RESPONSIVO MOBILE */
@media (max-width: 768px) {
    .sfc-container { width: 360px; height: 280px; }
    .sfc-card { width: 140px; height: 196px; left: calc(50% - 70px); }
    .sfc-name { font-size: 16px; bottom: 8px; }
    .sfc-badge { font-size: 10px; padding: 3px 8px; top: 8px; left: 8px; }
    .sfc-container.is-open .sfc-card:nth-child(1) { --fan-x: -110px; --fan-y: -15px; }
    .sfc-container.is-open .sfc-card:nth-child(2) { --fan-x: -60px;  --fan-y: -30px; }
    .sfc-container.is-open .sfc-card:nth-child(3) { --fan-x: -15px;  --fan-y: -35px; }
    .sfc-container.is-open .sfc-card:nth-child(4) { --fan-x: 15px;   --fan-y: -35px; }
    .sfc-container.is-open .sfc-card:nth-child(5) { --fan-x: 60px;   --fan-y: -30px; }
    .sfc-container.is-open .sfc-card:nth-child(6) { --fan-x: 110px;  --fan-y: -15px; }
}
</style>
</head>
<body>

<div class="sfc-wrapper">
    <div class="sfc-container" id="sfcContainer"></div>
</div>

<p class="instruction-text">
    <b>Hover no Desktop</b> ou <b>Tap no Mobile</b> para abrir o baralho em leque.<br>
    Passe o mouse individualmente por cada carta para ativar o brilho.
</p>

<script>
/**
 * ARQUIVO DE REFERÊNCIA DAS CARTAS
 * URLs formatadas para uso direto. Substitua conforme sua hospedagem de imagens.
 */
const CARDS = [
  { url: "https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?q=80&w=400&fit=crop", name: "Marquinhos", country: "Brasil" },
  { url: "https://images.unsplash.com/photo-1508344928928-7137b29de216?q=80&w=400&fit=crop", name: "Lionel Messi", country: "Argentina" },
  { url: "https://images.unsplash.com/photo-1518605368461-1e9411933ba5?q=80&w=400&fit=crop", name: "Memphis Depay", country: "Holanda" },
  { url: "https://images.unsplash.com/photo-1623341214825-9f4f963727da?q=80&w=400&fit=crop", name: "Erling Haaland", country: "Noruega" },
  { url: "https://images.unsplash.com/photo-1551280857-2b9bbe5240f5?q=80&w=400&fit=crop", name: "Cristiano Ronaldo", country: "Portugal" },
  { url: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=400&fit=crop", name: "Kylian Mbappé", country: "França" }
];

document.addEventListener("DOMContentLoaded", () => {
    const sfcContainer = document.getElementById("sfcContainer");
    if (sfcContainer) {
        let cardsHTML = '';
        // Inverte a array: a última carta do array torna-se o primeiro nó injetado 
        // e no DOM a última injetada será o elemento 0 (topo)
        const reversedCards = [...CARDS].reverse();
        reversedCards.forEach(card => {
            cardsHTML += `
            <div class="sfc-card">
                <div class="sfc-fallback"><span>Copa 2026</span></div>
                <img class="sfc-img" src="${card.url}" loading="lazy" onerror="this.style.display='none'">
                <div class="sfc-gradient"></div>
                <div class="sfc-badge">${card.country}</div>
                <div class="sfc-name">${card.name}</div>
                <div class="sfc-shine"></div>
            </div>`;
        });
        sfcContainer.innerHTML = cardsHTML;
        
        // EVENTOS (Hover e Tap)
        sfcContainer.addEventListener("mouseenter", () => sfcContainer.classList.add("is-open"));
        sfcContainer.addEventListener("mouseleave", () => sfcContainer.classList.remove("is-open"));
        sfcContainer.addEventListener("touchstart", (e) => sfcContainer.classList.toggle("is-open"), { passive: true });
    }
});
</script>
</body>
</html>
